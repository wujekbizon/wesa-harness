[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wesa-secure-engine"
version = "0.6.0"
description = "Greenfield WESA Secure Engine"
requires-python = ">=3.12"
dependencies = [
    "google-auth[requests]>=2.38,<3",
    "pymupdf>=1.27,<2",
    "pypdf>=6,<7",
    "PyYAML==6.0.3",
    "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1",
    "pytest==9.1.1",
]

[project.scripts]
wesa-engine = "wesa_engine.runtime.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wesa_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
