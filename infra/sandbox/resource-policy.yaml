apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: wesa-sandbox
spec:
  hard:
    count/jobs.batch: "4"
    count/pods: "4"
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "1"
    limits.memory: "512Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: wesa-sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 256Mi
